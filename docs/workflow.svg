<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1320" width="1500" height="1320" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7385"/></marker></defs><rect width="1500" height="1320" fill="#ffffff"/><text x="750.0" y="40" text-anchor="middle" font-size="26" font-weight="800" fill="#1d2330">Caption Editor: a caption pass, start to finish</text>
<text x="750.0" y="64" text-anchor="middle" font-size="14" fill="#4a5263">The video-editor pipeline hands you a clip folder; you fix it here; the pipeline renders what you saved.</text>
<rect x="515.0" y="86" width="470" height="60" rx="10" fill="#2b2f3a" stroke="#2b2f3a" stroke-width="2"/>
<text x="750.0" y="112.2" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">A short&#x27;s clip folder (from video-editor)</text>
<text x="750.0" y="131.2" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">&lt;clip&gt;.mp4 + captions.json (one word per card) + captions.srt</text>
<path d="M 750.0,146 L 750.0,172" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="515.0" y="174" width="470" height="79" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="750.0" y="200.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">1 · Launch the editor</text>
<text x="750.0" y="219.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">desktop shortcut (tray icon) — or  python server.py</text>
<text x="750.0" y="238.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">opens http://127.0.0.1:8765 in Chrome or Edge</text>
<path d="M 750.0,253 L 750.0,279" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="515.0" y="281" width="470" height="79" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="750.0" y="307.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">2 · Load</text>
<text x="750.0" y="326.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">the video + its captions.json</text>
<text x="750.0" y="345.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">+ optional speakers file (speaker colors + caption font)</text>
<path d="M 750.0,360 L 750.0,386" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="750.0,388.0 915.0,436 750.0,484.0 585.0,436" fill="#f3e8ff" stroke="#8a4fd6" stroke-width="2"/>
<text x="750.0" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">3 · What needs fixing?</text>
<text x="750.0" y="450" text-anchor="middle" font-size="13" font-weight="400" fill="#1d2330">any of these, in any order</text>
<path d="M 750.0,484.0 L 750.0,512.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 180.0,512.0 L 1320.0,512.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 180.0,512.0 L 180.0,542.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="75.0" y="544.0" width="210" height="117" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="180.0" y="570.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Words</text>
<text x="180.0" y="589.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">type in the text box</text>
<text x="180.0" y="608.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">| = line break (HECK|YES)</text>
<text x="180.0" y="627.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">😀 emoji · Win + .</text>
<text x="180.0" y="646.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">+ insert · ✕ delete</text>
<path d="M 408.0,512.0 L 408.0,542.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="303.0" y="544.0" width="210" height="117" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="408.0" y="570.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Speakers</text>
<text x="408.0" y="589.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">press a speaker key</text>
<text x="408.0" y="608.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">(B Ben, J Jared, …)</text>
<text x="408.0" y="627.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">on a word or a selection</text>
<text x="408.0" y="646.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">colors come from the list</text>
<path d="M 636.0,512.0 L 636.0,542.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="531.0" y="544.0" width="210" height="117" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="636.0" y="570.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Timing</text>
<text x="636.0" y="589.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">drag / resize blocks</text>
<text x="636.0" y="608.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">←/→ one frame</text>
<text x="636.0" y="627.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">(Shift = ten frames)</text>
<text x="636.0" y="646.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">or type start/end</text>
<path d="M 864.0,512.0 L 864.0,542.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="759.0" y="544.0" width="210" height="117" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="864.0" y="570.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Overlapping talk</text>
<text x="864.0" y="589.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">🕒+ Timeline adds a lane</text>
<text x="864.0" y="608.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">move a card to T2:</text>
<text x="864.0" y="627.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">shown smaller, under</text>
<text x="864.0" y="646.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">the main caption</text>
<path d="M 1092.0,512.0 L 1092.0,542.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="987.0" y="544.0" width="210" height="117" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="1092.0" y="570.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Effects + images</text>
<text x="1092.0" y="589.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">amber PROD NOTES field</text>
<text x="1092.0" y="608.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">fx words, a color,</text>
<text x="1092.0" y="627.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">an image/GIF link,</text>
<text x="1092.0" y="646.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">&quot;every time X is said&quot;</text>
<path d="M 1320.0,512.0 L 1320.0,542.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1215.0" y="544.0" width="210" height="117" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="1320.0" y="570.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Font</text>
<text x="1320.0" y="589.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">Caption font dropdown</text>
<text x="1320.0" y="608.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">Bebas Neue (house)</text>
<text x="1320.0" y="627.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">or 4 heavier faces</text>
<text x="1320.0" y="646.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">saved in speakers file</text>
<path d="M 180.0,661.0 L 180.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 408.0,661.0 L 408.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 636.0,661.0 L 636.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 864.0,661.0 L 864.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 1092.0,661.0 L 1092.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 1320.0,661.0 L 1320.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 180.0,689.0 L 1320.0,689.0" fill="none" stroke="#6b7385" stroke-width="2"/>
<path d="M 750.0,689.0 L 750.0,715.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="515.0" y="717.0" width="470" height="79" rx="10" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="750.0" y="743.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">4 · Save</text>
<text x="750.0" y="762.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">writes straight back to the same files</text>
<text x="750.0" y="781.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">warns about a card with no text and no note</text>
<path d="M 750.0,796.0 L 750.0,822.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="750.0,824.0 915.0,872.0 750.0,920.0 585.0,872.0" fill="#f3e8ff" stroke="#8a4fd6" stroke-width="2"/>
<text x="750.0" y="868.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">5 · Ready to render?</text>
<text x="750.0" y="886.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1d2330">nothing renders until you say so</text>
<path d="M 585.0,872.0 L 30,872.0 L 30,436 L 583.0,436" fill="none" stroke="#6b7385" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="550.0" y="864.0" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4fd6">NO</text>
<text x="46" y="654.0" transform="rotate(-90 46 654.0)" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4fd6">not yet: keep editing, save again</text>
<text x="774.0" y="938.0" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4fd6">YES</text>
<path d="M 750.0,920.0 L 750.0,950.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="470.0" y="952.0" width="560" height="79" rx="10" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="2"/>
<text x="750.0" y="978.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">6 · Ask Claude to render (video-editor repo)</text>
<text x="750.0" y="997.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">render_captions.py draws your cards exactly as saved; notes → effects,</text>
<text x="750.0" y="1016.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5263">image links are downloaded; ffmpeg lays it over the clip → &lt;clip&gt;_captioned.mp4</text>
<path d="M 750.0,1031.0 L 750.0,1057.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="750.0,1059.0 915.0,1107.0 750.0,1155.0 585.0,1107.0" fill="#f3e8ff" stroke="#8a4fd6" stroke-width="2"/>
<text x="750.0" y="1103.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">7 · Proof the video</text>
<text x="750.0" y="1121.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1d2330">does it look right?</text>
<path d="M 915.0,1107.0 L 1470,1107.0 L 1470,320.5 L 987.0,320.5" fill="none" stroke="#6b7385" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="950.0" y="1099.0" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4fd6">NO</text>
<text x="1454" y="713.75" transform="rotate(90 1454 713.75)" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4fd6">fix it: reload, edit, save, re-render</text>
<text x="774.0" y="1173.0" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4fd6">YES</text>
<path d="M 750.0,1155.0 L 750.0,1185.0" fill="none" stroke="#6b7385" stroke-width="2" marker-end="url(#ah)"/>
<rect x="515.0" y="1187.0" width="470" height="41" rx="20.5" fill="#e5f7ea" stroke="#2f9e57" stroke-width="2"/>
<text x="750.0" y="1213.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2330">Post it — with metadata.txt from the clip folder</text>
<rect x="70" y="1270" width="34" height="26" rx="5" fill="#fff1df" stroke="#e08a1e" stroke-width="2"/>
<text x="114" y="1288" font-size="14" fill="#1d2330">you, in the editor</text>
<rect x="276.79999999999995" y="1270" width="34" height="26" rx="5" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="2"/>
<text x="320.79999999999995" y="1288" font-size="14" fill="#1d2330">the video-editor pipeline / Claude</text>
<rect x="605.1999999999999" y="1270" width="34" height="26" rx="5" fill="#f3e8ff" stroke="#8a4fd6" stroke-width="2"/>
<text x="649.1999999999999" y="1288" font-size="14" fill="#1d2330">decision</text>
<rect x="736.0" y="1270" width="34" height="26" rx="13" fill="#e5f7ea" stroke="#2f9e57" stroke-width="2"/>
<text x="780.0" y="1288" font-size="14" fill="#1d2330">done</text></svg>